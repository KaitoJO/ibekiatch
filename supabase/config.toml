# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "ibekiatch"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[auth]
enabled = true
site_url = "https://ibekiatch.vercel.app"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/**",
  "https://ibekiatch.vercel.app",
  "https://ibekiatch.vercel.app/**",
]

[auth.email]
enable_signup = true
enable_confirmations = false
max_frequency = "1s"

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "onboarding@resend.dev"
sender_name = "ibekiatch"

[auth.email.template.confirmation]
subject = "ibekiatch アカウント確認"
content_path = "./supabase/templates/confirm-signup.html"
